# CI: the unit and API tests, then the same UI tests on every engine and browser the Factory supports.
# Each job starts the Pattern Shop image (ghcr.io/niranjankagri/pattern-shop-demo-app) next to the tests, so no job
# depends on a public demo site or on the hosted demo, and no two runs share data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a new browser, driver or shop image that breaks a test shows up within a week
    - cron: '30 23 * * 5'   # Friday 23:30 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the shop
        run: bash scripts/start-shop.sh
      - name: Unit tests, catalog adapters (REST, SOAP, legacy) and data sources
        run: ./mvnw -B verify -Dsuite=core
      - name: Test report in the job summary
        if: ${{ !cancelled() }}
        run: cat target/test-events/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-core
          path: |
            target/surefire-reports/
            target/test-events/
          retention-days: 30

  ui:
    name: UI (${{ matrix.engine }}, ${{ matrix.browser }}${{ matrix.remote && ', Selenium Grid' || '' }}, ${{ matrix.data }} data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every browser the Factory supports, and each test-data strategy (json, csv, api) on more than one engine
        include:
          - {engine: selenium, browser: chrome, remote: false, data: json}
          - {engine: selenium, browser: firefox, remote: false, data: csv}
          - {engine: selenium, browser: edge, remote: false, data: api}
          - {engine: selenium, browser: chrome, remote: true, data: json}
          - {engine: playwright, browser: chromium, remote: false, data: csv}
          - {engine: playwright, browser: firefox, remote: false, data: api}
          - {engine: playwright, browser: webkit, remote: false, data: json}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the shop
        run: bash scripts/start-shop.sh
      - name: Start Selenium Grid (remote runs)
        if: ${{ matrix.remote }}
        run: |
          docker run -d --name grid --network host --shm-size=2g selenium/standalone-chrome:4.52.0-20261101
          for i in $(seq 1 60); do curl -s localhost:4444/status | grep -q '"ready": *true' && exit 0; sleep 2; done
          docker logs grid; exit 1
      # Edge's first start on a fresh runner (profile, components) made the first test's page load hang, even with
      # --no-first-run; one headless start here takes that cost outside the tests
      - name: Warm up Edge
        if: ${{ matrix.browser == 'edge' }}
        run: |
          edge=$(command -v microsoft-edge-stable || command -v microsoft-edge)
          "$edge" --version
          time timeout 120 "$edge" --headless=new --no-sandbox --disable-dev-shm-usage --no-first-run             --no-default-browser-check --dump-dom about:blank > /dev/null || echo "Warm-up did not finish; the tests will show it"
      # Usually under a minute; a slow Ubuntu package mirror twice stalled it until the whole job was cancelled after
      # 15 minutes. So: 5 minutes per attempt and one more attempt (the install only; the tests are never retried)
      - name: Install the Playwright browser and its system libraries
        if: ${{ matrix.engine == 'playwright' }}
        run: |
          ./mvnw -B -q test-compile
          for attempt in 1 2; do
            timeout 300 ./mvnw -B -q org.codehaus.mojo:exec-maven-plugin:3.7.0:java -Dexec.classpathScope=test               -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.browser }}" && exit 0
            echo "::warning::Browser install attempt $attempt did not finish within 5 minutes"
          done
          exit 1
      - name: UI tests
        run: ./mvnw -B verify -Dsuite=ui -Dengine=${{ matrix.engine }} -Dbrowser=${{ matrix.browser }} -Dremote=${{ matrix.remote }} -Ddata.source=${{ matrix.data }}
      - name: Test report in the job summary
        if: ${{ !cancelled() }}
        run: cat target/test-events/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-ui-${{ matrix.engine }}-${{ matrix.browser }}${{ matrix.remote && '-grid' || '' }}
          path: |
            target/surefire-reports/
            target/test-events/
          retention-days: 30
