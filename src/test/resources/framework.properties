# Defaults of this project; a system property wins (./mvnw verify -Dengine=playwright -Dbrowser=webkit).
# engine: selenium (default) | playwright
#engine=selenium
# browser: chrome | firefox | edge (selenium, default chrome); chromium | firefox | webkit (playwright, default chromium).
# Not set here, so the default follows the engine.
#browser=chrome
headless=true
# remote=true: Selenium Grid at grid.url
remote=false
grid.url=http://localhost:4444
# The Pattern Shop under test: docker run -p 8080:8080 ghcr.io/niranjankagri/pattern-shop-demo-app
app.url=http://localhost:8080
# data.source: json | csv | api
data.source=json
timeout.seconds=10
